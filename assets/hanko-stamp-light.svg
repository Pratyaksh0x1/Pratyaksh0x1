<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <filter id="hanko-rough-standalone-light" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g filter="url(#hanko-rough-standalone-light)">
    <!-- Outer hand-pressed rounded rectangular border -->
    <rect x="8" y="8" width="84" height="84" rx="16" fill="none" stroke="#C8382B" stroke-width="4.5" opacity="0.92" />
    <rect x="14" y="14" width="72" height="72" rx="11" fill="none" stroke="#C8382B" stroke-width="1.2" opacity="0.45" />
    <!-- Character: 拓 (Taku / Hiraku: To pioneer, break new ground) -->
    <text x="50" y="67" text-anchor="middle" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif" font-weight="700" font-size="46" fill="#C8382B">拓</text>
  </g>
</svg>
