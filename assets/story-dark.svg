<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180" fill="none">
  <style>
    .commit-hash {
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 1px;
      fill: #8C867B;
    }
    .commit-msg {
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.5px;
      fill: #E8E3D8;
    }
    .commit-warn {
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.5px;
      fill: #E0503D;
    }
    .commit-tag {
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 1px;
      fill: #66625C;
    }
  </style>

  <!-- Left vertical timeline branch line -->
  <line x1="38" y1="24" x2="38" y2="156" stroke="#2A2826" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Commit 1 -->
  <g transform="translate(0, 30)">
    <circle cx="38" cy="0" r="3.5" fill="#2A2826" stroke="#8C867B" stroke-width="1.5" />
    <text x="64" y="4" class="commit-hash">1a04d2e</text>
    <text x="140" y="4" class="commit-msg">feat(core): autonomous agent loop on Bun runtime</text>
    <text x="730" y="4" class="commit-tag">[origin/main]</text>
  </g>

  <!-- Commit 2 -->
  <g transform="translate(0, 70)">
    <circle cx="38" cy="0" r="3.5" fill="#2A2826" stroke="#8C867B" stroke-width="1.5" />
    <text x="64" y="4" class="commit-hash">4b89f10</text>
    <text x="140" y="4" class="commit-msg">feat(tools): recursive tool executor with unrestricted shell</text>
    <text x="730" y="4" class="commit-tag">+182 -14</text>
  </g>

  <!-- Commit 3 (The War Story incident) -->
  <g transform="translate(0, 110)">
    <circle cx="38" cy="0" r="4" fill="#E0503D" opacity="0.9" />
    <text x="64" y="4" class="commit-hash" fill="#E0503D">6e21c38</text>
    <text x="140" y="4" class="commit-warn">oops: agent hallucinated and attempted to edit its own prompt</text>
    <text x="730" y="4" class="commit-tag" fill="#E0503D">REVOKED</text>
  </g>

  <!-- Commit 4 (The Architectural Fix) -->
  <g transform="translate(0, 150)">
    <circle cx="38" cy="0" r="3.5" fill="#E8E3D8" stroke="#E0503D" stroke-width="1.5" />
    <text x="64" y="4" class="commit-hash">8d44e72</text>
    <text x="140" y="4" class="commit-msg">refactor: mandatory git-diff preview approval gate before disk writes</text>
    <text x="730" y="4" class="commit-tag">[v0.4.0-stable]</text>
  </g>
</svg>
