<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230" fill="none">
  <defs>
    <linearGradient id="contrib-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D13" />
      <stop offset="100%" stop-color="#16141F" />
    </linearGradient>

    <filter id="snake-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes wave-pulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); filter: drop-shadow(0 0 4px rgba(224, 80, 61, 0.8)); }
      }
      @keyframes snake-motion {
        0% { transform: translate(55px, 60px); }
        15% { transform: translate(320px, 110px); }
        30% { transform: translate(560px, 80px); }
        45% { transform: translate(720px, 125px); }
        60% { transform: translate(820px, 90px); }
        75% { transform: translate(620px, 140px); }
        90% { transform: translate(240px, 95px); }
        100% { transform: translate(55px, 60px); }
      }
      @keyframes snake-tail-1 {
        0% { transform: translate(45px, 60px); }
        15% { transform: translate(310px, 110px); }
        30% { transform: translate(550px, 80px); }
        45% { transform: translate(710px, 125px); }
        60% { transform: translate(810px, 90px); }
        75% { transform: translate(610px, 140px); }
        90% { transform: translate(230px, 95px); }
        100% { transform: translate(45px, 60px); }
      }
      @keyframes snake-tail-2 {
        0% { transform: translate(35px, 60px); }
        15% { transform: translate(300px, 110px); }
        30% { transform: translate(540px, 80px); }
        45% { transform: translate(700px, 125px); }
        60% { transform: translate(800px, 90px); }
        75% { transform: translate(600px, 140px); }
        90% { transform: translate(220px, 95px); }
        100% { transform: translate(35px, 60px); }
      }

      .snake-head { animation: snake-motion 14s ease-in-out infinite; filter: url(#snake-glow); }
      .snake-seg-1 { animation: snake-tail-1 14s ease-in-out infinite; animation-delay: -0.15s; filter: url(#snake-glow); }
      .snake-seg-2 { animation: snake-tail-2 14s ease-in-out infinite; animation-delay: -0.3s; filter: url(#snake-glow); }

      .pulse-high { animation: wave-pulse 3.5s ease-in-out infinite; transform-origin: center; }
      .d1 { animation-delay: 0.2s; }
      .d2 { animation-delay: 0.8s; }
      .d3 { animation-delay: 1.4s; }
      .d4 { animation-delay: 2.0s; }
      .d5 { animation-delay: 2.6s; }

      .font-mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace; }
      .font-kanji { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="230" rx="12" fill="url(#contrib-bg-dark)" stroke="#262232" stroke-width="1.2" />

  <!-- Bilingual Header -->
  <g transform="translate(24, 28)">
    <text x="0" y="0" class="font-mono" font-size="12" fill="#E8E3D8" font-weight="600">
      CONTRIBUTION CHRONICLE <tspan class="font-kanji" font-weight="400" font-size="11" fill="#8C867B">// 活動記録 (Activity Log)</tspan>
    </text>
    <text x="350" y="0" class="font-mono" font-size="12" fill="#E0503D" font-weight="700">737 CONTRIBUTIONS (507 COMMITS)</text>
    <text x="630" y="0" class="font-mono" font-size="10.5" fill="#66615A">CYCLE: 2025 – 2026</text>

    <!-- Legend (Less / 少 to More / 多) -->
    <g transform="translate(710, -10)">
      <text x="-32" y="10" class="font-mono" font-size="9" fill="#66615A">LESS (少)</text>
      <rect x="14" y="0" width="10" height="10" rx="2" fill="#1C1A24" />
      <rect x="28" y="0" width="10" height="10" rx="2" fill="#362232" />
      <rect x="42" y="0" width="10" height="10" rx="2" fill="#6E2838" />
      <rect x="56" y="0" width="10" height="10" rx="2" fill="#A83938" />
      <rect x="70" y="0" width="10" height="10" rx="2" fill="#E0503D" />
      <text x="86" y="10" class="font-mono" font-size="9" fill="#E0503D">MORE (多)</text>
    </g>
  </g>

  <!-- Month Headers -->
  <g transform="translate(54, 52)" class="font-mono" font-size="9" fill="#66615A" letter-spacing="1">
    <text x="0" y="0">OCT</text>
    <text x="68" y="0">NOV</text>
    <text x="136" y="0">DEC</text>
    <text x="204" y="0">JAN</text>
    <text x="272" y="0">FEB</text>
    <text x="340" y="0">MAR</text>
    <text x="408" y="0">APR</text>
    <text x="476" y="0">MAY</text>
    <text x="544" y="0">JUN</text>
    <text x="612" y="0">JUL</text>
    <text x="680" y="0">AUG (PEAK)</text>
    <text x="760" y="0">SEP</text>
  </g>

  <!-- Weekday Labels (Mon / 月, Wed / 水, Fri / 金) -->
  <g transform="translate(14, 76)" class="font-mono" font-size="8.5" fill="#66615A">
    <text x="0" y="8">MON(月)</text>
    <text x="0" y="40">WED(水)</text>
    <text x="0" y="72">FRI(金)</text>
  </g>

  <!-- 52-Week Contribution Matrix with Real Distribution -->
  <g transform="translate(54, 62)">
    <!-- Weeks 1 - 32: Moderate / baseline activity -->
    <g id="early-weeks">
      <!-- Repeated low & medium dot rows -->
      <rect x="0" y="0" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="0" y="16" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="0" y="32" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="0" y="48" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="0" y="64" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="0" y="80" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="0" y="96" width="11" height="11" rx="2.5" fill="#1C1A24" />
      <rect x="16" y="0" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="16" y="16" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="16" y="32" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="16" y="48" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="16" y="64" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="16" y="80" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="16" y="96" width="11" height="11" rx="2.5" fill="#1C1A24" />
      <rect x="32" y="0" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="32" y="16" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="32" y="32" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="32" y="48" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="32" y="64" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="32" y="80" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="32" y="96" width="11" height="11" rx="2.5" fill="#1C1A24" />
      <rect x="48" y="0" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="48" y="16" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="48" y="32" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="48" y="48" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="48" y="64" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="48" y="80" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="48" y="96" width="11" height="11" rx="2.5" fill="#1C1A24" />
      <rect x="64" y="0" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="64" y="16" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="64" y="32" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="64" y="48" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="64" y="64" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="64" y="80" width="11" height="11" rx="2.5" fill="#1C1A24" /><rect x="64" y="96" width="11" height="11" rx="2.5" fill="#1C1A24" />
      <!-- Scattered spring activity (Apr / Jun) -->
      <rect x="256" y="48" width="11" height="11" rx="2.5" fill="#362232" />
      <rect x="256" y="64" width="11" height="11" rx="2.5" fill="#6E2838" />
      <rect x="336" y="16" width="11" height="11" rx="2.5" fill="#362232" />
      <rect x="352" y="32" width="11" height="11" rx="2.5" fill="#6E2838" />
      <rect x="352" y="48" width="11" height="11" rx="2.5" fill="#A83938" />
      <rect x="384" y="48" width="11" height="11" rx="2.5" fill="#362232" />
      <rect x="400" y="32" width="11" height="11" rx="2.5" fill="#6E2838" />
      <rect x="400" y="48" width="11" height="11" rx="2.5" fill="#362232" />
      <rect x="416" y="64" width="11" height="11" rx="2.5" fill="#6E2838" />
    </g>

    <!-- Weeks 33 - 52: Massive High Intensity (August & September: WorkMesh 272 + LeetCode 210) -->
    <g transform="translate(528, 0)">
      <!-- 18 columns of dense, pulsating vermilion activity -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="11" height="11" rx="2.5" fill="#362232" /><rect x="0" y="16" width="11" height="11" rx="2.5" fill="#6E2838" /><rect x="0" y="32" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="0" y="48" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d1" /><rect x="0" y="64" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d3" /><rect x="0" y="80" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="0" y="96" width="11" height="11" rx="2.5" fill="#6E2838" />
        <rect x="16" y="0" width="11" height="11" rx="2.5" fill="#6E2838" /><rect x="16" y="16" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="16" y="32" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d2" /><rect x="16" y="48" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d5" /><rect x="16" y="64" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d1" /><rect x="16" y="80" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="16" y="96" width="11" height="11" rx="2.5" fill="#362232" />
        <rect x="32" y="0" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="32" y="16" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d3" /><rect x="32" y="32" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d1" /><rect x="32" y="48" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d4" /><rect x="32" y="64" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d2" /><rect x="32" y="80" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="32" y="96" width="11" height="11" rx="2.5" fill="#6E2838" />
        <rect x="48" y="0" width="11" height="11" rx="2.5" fill="#6E2838" /><rect x="48" y="16" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d2" /><rect x="48" y="32" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d5" /><rect x="48" y="48" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d3" /><rect x="48" y="64" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="48" y="80" width="11" height="11" rx="2.5" fill="#6E2838" /><rect x="48" y="96" width="11" height="11" rx="2.5" fill="#362232" />
        <rect x="64" y="0" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="64" y="16" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d4" /><rect x="64" y="32" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d1" /><rect x="64" y="48" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d2" /><rect x="64" y="64" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d5" /><rect x="64" y="80" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="64" y="96" width="11" height="11" rx="2.5" fill="#6E2838" />
        <rect x="80" y="0" width="11" height="11" rx="2.5" fill="#6E2838" /><rect x="80" y="16" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="80" y="32" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d3" /><rect x="80" y="48" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d5" /><rect x="80" y="64" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d1" /><rect x="80" y="80" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="80" y="96" width="11" height="11" rx="2.5" fill="#362232" />
        <rect x="96" y="0" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="96" y="16" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d1" /><rect x="96" y="32" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d4" /><rect x="96" y="48" width="11" height="11" rx="2.5" fill="#E0503D" class="pulse-high d2" /><rect x="96" y="64" width="11" height="11" rx="2.5" fill="#A83938" /><rect x="96" y="80" width="11" height="11" rx="2.5" fill="#6E2838" /><rect x="96" y="96" width="11" height="11" rx="2.5" fill="#1C1A24" />
