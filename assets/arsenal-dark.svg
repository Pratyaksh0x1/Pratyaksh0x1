<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="140" fill="none">
  <defs>
    <linearGradient id="arsenal-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D13" />
      <stop offset="100%" stop-color="#16141F" />
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace; }
    .font-kanji { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; }
    .card-border { transition: stroke 0.3s; }
  </style>

  <!-- Card 1: Autonomous Agent Loops -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="208" height="140" rx="10" fill="url(#arsenal-bg-dark)" stroke="#262232" stroke-width="1.2" class="card-border" />
    <circle cx="20" cy="24" r="3" fill="#E0503D" />
    <text x="32" y="27" class="font-mono" font-size="10" fill="#8C867B" letter-spacing="1">AGENT RUNTIME</text>
    <text x="18" y="56" class="font-kanji" font-size="15" font-weight="700" fill="#E8E3D8">自律循環 <tspan class="font-mono" font-size="10.5" font-weight="400" fill="#8C867B">// Loops</tspan></text>
    <text x="18" y="76" class="font-mono" font-size="11" fill="#E0503D">Bun · TypeScript · LLM</text>
    <line x1="18" y1="92" x2="190" y2="92" stroke="#221E2C" stroke-width="1" />
    <text x="18" y="114" class="font-mono" font-size="9.5" fill="#6B655D">RECURSIVE TOOL EXEC</text>
    <text x="18" y="128" class="font-mono" font-size="9.5" fill="#6B655D">STAGED DIFF GATING</text>
  </g>

  <!-- Card 2: Applied Machine Learning -->
  <g transform="translate(224, 0)">
    <rect x="0" y="0" width="208" height="140" rx="10" fill="url(#arsenal-bg-dark)" stroke="#262232" stroke-width="1.2" class="card-border" />
    <circle cx="20" cy="24" r="3" fill="#E0503D" />
    <text x="32" y="27" class="font-mono" font-size="10" fill="#8C867B" letter-spacing="1">INTELLIGENCE</text>
    <text x="18" y="56" class="font-kanji" font-size="15" font-weight="700" fill="#E8E3D8">機械学習 <tspan class="font-mono" font-size="10.5" font-weight="400" fill="#8C867B">// ML</tspan></text>
    <text x="18" y="76" class="font-mono" font-size="11" fill="#E0503D">scikit-learn · Pandas</text>
    <line x1="18" y1="92" x2="190" y2="92" stroke="#221E2C" stroke-width="1" />
    <text x="18" y="114" class="font-mono" font-size="9.5" fill="#6B655D">RANDOM FOREST (R² 0.83)</text>
    <text x="18" y="128" class="font-mono" font-size="9.5" fill="#6B655D">STRATIFIED PIPELINES</text>
  </g>

  <!-- Card 3: Systems & Foundations -->
  <g transform="translate(448, 0)">
    <rect x="0" y="0" width="208" height="140" rx="10" fill="url(#arsenal-bg-dark)" stroke="#262232" stroke-width="1.2" class="card-border" />
    <circle cx="20" cy="24" r="3" fill="#E0503D" />
    <text x="32" y="27" class="font-mono" font-size="10" fill="#8C867B" letter-spacing="1">FOUNDATIONS</text>
    <text x="18" y="56" class="font-kanji" font-size="15" font-weight="700" fill="#E8E3D8">低層設計 <tspan class="font-mono" font-size="10.5" font-weight="400" fill="#8C867B">// Systems</tspan></text>
    <text x="18" y="76" class="font-mono" font-size="11" fill="#E0503D">C · C++ · Algorithms</text>
    <line x1="18" y1="92" x2="190" y2="92" stroke="#221E2C" stroke-width="1" />
    <text x="18" y="114" class="font-mono" font-size="9.5" fill="#6B655D">400+ LEETCODE / CODE360</text>
    <text x="18" y="128" class="font-mono" font-size="9.5" fill="#6B655D">MEMORY &amp; CACHE COHERENCE</text>
  </g>

  <!-- Card 4: Microservices & Data -->
  <g transform="translate(672, 0)">
    <rect x="0" y="0" width="208" height="140" rx="10" fill="url(#arsenal-bg-dark)" stroke="#262232" stroke-width="1.2" class="card-border" />
    <circle cx="20" cy="24" r="3" fill="#E0503D" />
    <text x="32" y="27" class="font-mono" font-size="10" fill="#8C867B" letter-spacing="1">BACKEND CORE</text>
    <text x="18" y="56" class="font-kanji" font-size="15" font-weight="700" fill="#E8E3D8">通信基盤 <tspan class="font-mono" font-size="10.5" font-weight="400" fill="#8C867B">// Cloud</tspan></text>
    <text x="18" y="76" class="font-mono" font-size="11" fill="#E0503D">FastAPI · Flask · Mongo</text>
    <line x1="18" y1="92" x2="190" y2="92" stroke="#221E2C" stroke-width="1" />
    <text x="18" y="114" class="font-mono" font-size="9.5" fill="#6B655D">REST &amp; STREAMING APIS</text>
    <text x="18" y="128" class="font-mono" font-size="9.5" fill="#6B655D">ASYNC DISPATCH LOOPS</text>
  </g>
</svg>
