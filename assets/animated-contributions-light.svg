      <text x="86" y="10" class="font-mono" font-size="9" fill="#C8382B">MORE (多)</text>
    </g>
  </g>

  <g transform="translate(54, 52)" class="font-mono" font-size="9" fill="#8C867C" letter-spacing="1">
