<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230" fill="none">
  <defs>
    <linearGradient id="contrib-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0" />
      <stop offset="100%" stop-color="#EDE7DC" />
    </linearGradient>

    <filter id="snake-glow-light" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes wave-pulse-light {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); filter: drop-shadow(0 0 4px rgba(200, 56, 43, 0.7)); }
      }
      @keyframes snake-motion {
        0% { transform: translate(55px, 60px); }
        15% { transform: translate(320px, 110px); }
        30% { transform: translate(560px, 80px); }
        45% { transform: translate(720px, 125px); }
        60% { transform: translate(820px, 90px); }
        75% { transform: translate(620px, 140px); }
        90% { transform: translate(240px, 95px); }
        100% { transform: translate(55px, 60px); }
      }
      @keyframes snake-tail-1 {
        0% { transform: translate(45px, 60px); }
        15% { transform: translate(310px, 110px); }
        30% { transform: translate(550px, 80px); }
        45% { transform: translate(710px, 125px); }
        60% { transform: translate(810px, 90px); }
        75% { transform: translate(610px, 140px); }
        90% { transform: translate(230px, 95px); }
        100% { transform: translate(45px, 60px); }
      }
      @keyframes snake-tail-2 {
        0% { transform: translate(35px, 60px); }
        15% { transform: translate(300px, 110px); }
        30% { transform: translate(540px, 80px); }
        45% { transform: translate(700px, 125px); }
        60% { transform: translate(800px, 90px); }
        75% { transform: translate(600px, 140px); }
        90% { transform: translate(220px, 95px); }
        100% { transform: translate(35px, 60px); }
      }

      .snake-head-light { animation: snake-motion 14s ease-in-out infinite; filter: url(#snake-glow-light); }
      .snake-seg-1-light { animation: snake-tail-1 14s ease-in-out infinite; animation-delay: -0.15s; filter: url(#snake-glow-light); }
      .snake-seg-2-light { animation: snake-tail-2 14s ease-in-out infinite; animation-delay: -0.3s; filter: url(#snake-glow-light); }

      .pulse-high-light { animation: wave-pulse-light 3.5s ease-in-out infinite; transform-origin: center; }
      .d1 { animation-delay: 0.2s; }
      .d2 { animation-delay: 0.8s; }
      .d3 { animation-delay: 1.4s; }
      .d4 { animation-delay: 2.0s; }
      .d5 { animation-delay: 2.6s; }

      .font-mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace; }
      .font-kanji { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="230" rx="12" fill="url(#contrib-bg-light)" stroke="#DDD6C8" stroke-width="1.2" />

  <g transform="translate(24, 28)">
    <text x="0" y="0" class="font-mono" font-size="12" fill="#1C1B19" font-weight="600">
      CONTRIBUTION CHRONICLE <tspan class="font-kanji" font-weight="400" font-size="11" fill="#756F67">// 活動記録 (Activity Log)</tspan>
    </text>
    <text x="350" y="0" class="font-mono" font-size="12" fill="#C8382B" font-weight="700">749 CONTRIBUTIONS (507 COMMITS)</text>
