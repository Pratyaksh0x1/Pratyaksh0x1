<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="100%" height="250" fill="none">
  <defs>
    <linearGradient id="about-card-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0" />
      <stop offset="100%" stop-color="#EDE7DC" />
    </linearGradient>

    <style>
      @keyframes cursor-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }

      .blink { animation: cursor-blink 1s infinite; }
      .pulse { animation: pulse-dot 2.2s ease-in-out infinite; transform-origin: center; }

      .font-mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace; }
      .font-kanji { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="580" height="250" rx="10" fill="url(#about-card-bg-light)" stroke="#DDD6C8" stroke-width="1.2" />

  <g transform="translate(16, 20)">
    <circle cx="0" cy="0" r="3.5" fill="#C8382B" opacity="0.85" />
    <circle cx="12" cy="0" r="3.5" fill="#D4882B" opacity="0.65" />
    <circle cx="24" cy="0" r="3.5" fill="#2E854B" opacity="0.65" />
    <text x="42" y="3.5" class="font-mono" font-size="11" fill="#756F67" letter-spacing="1">pratyaksh@system-node: ~/about.sh</text>
    <circle cx="480" cy="0" r="3" fill="#C8382B" class="pulse" />
    <text x="492" y="3.5" class="font-mono" font-size="10" fill="#C8382B">ONLINE</text>
  </g>

  <line x1="0" y1="36" x2="580" y2="36" stroke="#DDD6C8" stroke-width="1" />

  <g transform="translate(20, 62)">
    <text x="0" y="0" class="font-mono" font-size="12" fill="#756F67">
      <tspan fill="#C8382B">$</tspan> whoami <tspan fill="#8C867C">// 自己 (Identity)</tspan>
    </text>
    <text x="0" y="20" class="font-mono" font-size="13" font-weight="600" fill="#1C1B19">
      Pratyaksh Tomar <tspan font-size="11" font-weight="400" fill="#756F67">· プラチャクシュ (Pratyaksh) · Systems &amp; AI Architect</tspan>
    </text>

    <text x="0" y="48" class="font-mono" font-size="12" fill="#756F67">
      <tspan fill="#C8382B">$</tspan> focus --domain <tspan fill="#8C867C">// 専門領域 (Focus Domain)</tspan>
    </text>
    <text x="0" y="66" class="font-mono" font-size="12" fill="#383531">
      Autonomous Agent Loops · Bun/TypeScript Runtimes · Applied ML
    </text>

    <text x="0" y="94" class="font-mono" font-size="12" fill="#756F67">
      <tspan fill="#C8382B">$</tspan> cat /proc/stats <tspan fill="#8C867C">// 実績データ (Telemetry Stats)</tspan>
    </text>
    <text x="0" y="112" class="font-mono" font-size="12" fill="#1C1B19">
      <tspan fill="#C8382B" font-weight="700">734+</tspan> GitHub Commits · <tspan fill="#C8382B" font-weight="700">400+</tspan> LeetCode &amp; Code360 Solved
    </text>

    <text x="0" y="140" class="font-mono" font-size="12" fill="#756F67">
      <tspan fill="#C8382B">$</tspan> echo $CORE_RULE <tspan fill="#8C867C">// 信条 (Core Creed)</tspan>
    </text>
    <text x="0" y="158" class="font-mono" font-size="12" fill="#2E854B">
      "Mandatory git-diff approval before any agent writes to disk."<tspan class="blink" fill="#C8382B">_</tspan>
    </text>
  </g>
</svg>
