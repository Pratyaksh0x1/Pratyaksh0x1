<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="100%" height="250" fill="none">
  <defs>
    <linearGradient id="about-card-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D13" />
      <stop offset="100%" stop-color="#161420" />
    </linearGradient>

    <style>
      @keyframes cursor-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }
      @keyframes scanline {
        0% { transform: translateY(-20px); opacity: 0; }
        50% { opacity: 0.15; }
        100% { transform: translateY(250px); opacity: 0; }
      }

      .blink { animation: cursor-blink 1s infinite; }
      .pulse { animation: pulse-dot 2.2s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scanline 8s linear infinite; }

      .font-mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace; }
      .font-kanji { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="0" y="0" width="580" height="250" rx="10" fill="url(#about-card-bg-dark)" stroke="#262232" stroke-width="1.2" />

  <!-- Scanline Glow -->
  <line x1="0" y1="0" x2="580" y2="0" stroke="#E0503D" stroke-width="1" class="scan" />

  <!-- Terminal Title Bar -->
  <g transform="translate(16, 20)">
    <circle cx="0" cy="0" r="3.5" fill="#E0503D" opacity="0.85" />
    <circle cx="12" cy="0" r="3.5" fill="#D4882B" opacity="0.65" />
    <circle cx="24" cy="0" r="3.5" fill="#2E854B" opacity="0.65" />
    <text x="42" y="3.5" class="font-mono" font-size="11" fill="#8C867B" letter-spacing="1">pratyaksh@system-node: ~/about.sh</text>
    <circle cx="480" cy="0" r="3" fill="#E0503D" class="pulse" />
    <text x="492" y="3.5" class="font-mono" font-size="10" fill="#E0503D">ONLINE</text>
  </g>

  <line x1="0" y1="36" x2="580" y2="36" stroke="#221E2C" stroke-width="1" />

  <!-- Animated Telemetry Lines with bilingual English + Japanese -->
  <g transform="translate(20, 62)">
    <!-- Line 1: Identity -->
    <text x="0" y="0" class="font-mono" font-size="12" fill="#8C867B">
      <tspan fill="#E0503D">$</tspan> whoami <tspan fill="#66615A">// 自己 (Identity)</tspan>
    </text>
    <text x="0" y="20" class="font-mono" font-size="13" font-weight="600" fill="#E8E3D8">
      Pratyaksh Tomar <tspan font-size="11" font-weight="400" fill="#8C867B">· プラチャクシュ (Pratyaksh) · Systems &amp; AI Architect</tspan>
    </text>

    <!-- Line 2: Focus & Academics -->
    <text x="0" y="48" class="font-mono" font-size="12" fill="#8C867B">
      <tspan fill="#E0503D">$</tspan> focus --domain <tspan fill="#66615A">// 専門領域 (Focus Domain)</tspan>
    </text>
    <text x="0" y="66" class="font-mono" font-size="12" fill="#C5BFB5">
      Autonomous Agent Loops · Bun/TypeScript Runtimes · Applied ML
    </text>

    <!-- Line 3: Real Stats -->
    <text x="0" y="94" class="font-mono" font-size="12" fill="#8C867B">
      <tspan fill="#E0503D">$</tspan> cat /proc/stats <tspan fill="#66615A">// 実績データ (Telemetry Stats)</tspan>
    </text>
    <text x="0" y="112" class="font-mono" font-size="12" fill="#E8E3D8">
      <tspan fill="#E0503D" font-weight="700">734+</tspan> GitHub Commits · <tspan fill="#E0503D" font-weight="700">400+</tspan> LeetCode &amp; Code360 Solved
    </text>

    <!-- Line 4: Philosophy / Rule -->
    <text x="0" y="140" class="font-mono" font-size="12" fill="#8C867B">
      <tspan fill="#E0503D">$</tspan> echo $CORE_RULE <tspan fill="#66615A">// 信条 (Core Creed)</tspan>
    </text>
    <text x="0" y="158" class="font-mono" font-size="12" fill="#48B369">
      "Mandatory git-diff approval before any agent writes to disk."<tspan class="blink" fill="#E0503D">_</tspan>
    </text>
  </g>
</svg>
