name: Sync Live Contributions & Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Live Contributions to Japanese Chronicle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_contributions.py

      - name: Generate Snake SVG
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: Pratyaksh0x1
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-light&color_snake=#C8382B&color_dots=#f4f0e8,#e2d9cc,#c79f97,#b85a50,#c8382b
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E0503D&color_dots=#141312,#252126,#482531,#8f3337,#e0503d

      - name: Commit & Push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg assets/animated-contributions-dark.svg assets/animated-contributions-light.svg || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync live contribution metrics & snake [skip ci]" && git push)
